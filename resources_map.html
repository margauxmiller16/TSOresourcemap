<!DOCTYPE html>
<html>
<head>
  <title>Philadelphia Resources Map</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" 
        integrity="sha256-sA+tdm9KZ2g+kEoZjCzw5yFpZpN6Gocd7r0l1luj0kM=" 
        crossorigin=""/>
  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" 
          integrity="sha256-o9N1j9Jt1L+6cX3eWzJq1oXqQFA1Hv9oSz2Dg9f0h0c=" 
          crossorigin=""></script>
</head>
<body>
  <h2 style="text-align:center;">Philadelphia Resources Map</h2>
  <div id="map" style="width: 100%; height: 600px;"></div>

  <script>
    // Resource data
    var resources = [
      {
        name: "Appletree Family Center",
        address: "1430 Cherry St., Philadelphia, PA",
        lat: 39.95539,
        lng: -75.16396,
        category: "Shelter",
        hours: "Mon-Fri 7am-7pm",
        phone: "(215) 686-7150"
      },
      {
        name: "Roosevelt Darby Center",
        address: "804 N. Broad St, Philadelphia, PA",
        lat: 40.013,
        lng: -75.150,
        category: "Shelter",
        hours: "Mon–Fri 7am-5pm",
        phone: "(215) 685-3700"
      },
      {
        name: "The Veterans Multi-Service Center",
        address: "213-217 N. 4th St., Philadelphia, PA",
        lat: 39.95,
        lng: -75.14,
        category: "Shelter",
        hours: "Tues and Thurs 9am-2pm",
        phone: "(215) 923-2600"
      },
      {
        name: "Hub of Hope",
        address: "1401 JFK Pkway, Suburban Station Concourse, Philadelphia, PA",
        lat: 39.9548,
        lng: -75.1662,
        category: "Food Bank",
        hours: "Daily 1-3pm",
        phone: "(215) 686-8686"
      },
      {
        name: "Bethesda Project",
        address: "907 Hamilton St. Philadelphia, PA",
        lat: 39.9436,
        lng: -75.1680,
        category: "Food Bank",
        hours: "Daily 12pm-1pm",
        phone: "215-985-1600"
      },
      {
        name: "Philabundance",
        address: "3890 N. 10th St., 2nd Floor, Philadelphia, PA",
        lat: 39.9231,
        lng: -75.1689,
        category: "Food Bank",
        hours: "Tues-Thurs 10am-12pm",
        phone: "267-908-9000"
      },
      {
        name: "Grace Cafe",
        address: "55 N Broad St, Philadelphia, PA",
        lat: 39.95418,
        lng: -75.16292,
        category: "Food Bank",
        hours: "Mon-Sat 8am-1:30pm Sun 5pm-6pm",
        phone: "215-568-6250"
      },
      {
        name: "St. Francis Inn",
        address: "2441 Kensington Ave, Philadelphia, PA",
        lat: 39.9950,
        lng: -75.1220,
        category: "Food Bank",
        hours: "Mon 4:30-6:30pm Tues-Thurs 10-11am & 4:30-6pm",
        phone: "215-423-5845"
      }
    ];

    // Initialize map
    var map = L.map('map').setView([39.95, -75.16], 12);

    // Add OpenStreetMap tiles
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map);

    // Icon URLs
    var shelterIcon = L.icon({
      iconUrl: 'https://cdn-icons-png.flaticon.com/512/25/25694.png',
      iconSize: [30, 30],
      iconAnchor: [15, 30],
      popupAnchor: [0, -30]
    });

    var foodbankIcon = L.icon({
      iconUrl: 'https://cdn-icons-png.flaticon.com/512/891/891462.png',
      iconSize: [30, 30],
      iconAnchor: [15, 30],
      popupAnchor: [0, -30]
    });

    // Add markers
    resources.forEach(function(r) {
      var icon = r.category === "Shelter" ? shelterIcon : foodbankIcon;
      L.marker([r.lat, r.lng], {icon: icon})
        .bindPopup(
          '<b>' + r.name + '</b><br>' +
          r.category + '<br>' +
          r.address + '<br>' +
          r.hours + '<br>' +
          r.phone
        ).addTo(map);
    });
  </script>
</body>
</html>
